<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YTS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;1,14..32,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap"
        rel="stylesheet">
    <style>
        /* ponytail: Bareis + Nicolaus split-screen monochrome system */
        :root {
            --color-obsidian: #000000;
            --color-bone: #ffffff;
            --color-ash: #a9a9a9;
            --font-lausanne: 'Inter', ui-sans-serif, system-ui, sans-serif;
            --font-victor-serif: 'Source Serif 4', ui-serif, Georgia, serif;
            --radius-full: 120px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--color-obsidian);
            color: var(--color-bone);
            font-family: var(--font-lausanne);
            font-weight: 400;
            font-size: 16px;
            line-height: 1.2;
            height: 100vh;
            overflow: hidden;
        }

        /* — Main split layout — */
        .layout {
            display: flex;
            height: 100vh;
        }

        /* — Left sidebar / control column — */
        .sidebar {
            width: 42%;
            min-width: 340px;
            max-width: 520px;
            border-right: 1px solid var(--color-bone);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--color-bone);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .nav-pills {
            display: flex;
            gap: 7px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .search-pill {
            flex: 1;
            padding: 10px 20px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-bone);
            background: transparent;
            color: var(--color-bone);
            font-family: var(--font-lausanne);
            font-size: 15px;
            font-weight: 400;
            outline: none;
        }

        .search-pill::placeholder {
            color: var(--color-ash);
        }

        /* — Section headings — */
        .section-head {
            padding: 20px 28px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-head h2 {
            font-size: 56px;
            font-weight: 400;
            line-height: 1;
        }

        .collapse-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-bone);
            background: transparent;
            color: var(--color-bone);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* — Genre filter grid — */
        .filter-grid {
            padding: 0 28px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid var(--color-bone);
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            max-height: 600px;
            position: relative;
        }

        .filter-grid.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-bone);
            background: transparent;
            color: var(--color-bone);
            font-family: var(--font-lausanne);
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            text-decoration: none;
            line-height: 1;
            white-space: nowrap;
        }

        .pill.active {
            background: var(--color-bone);
            color: var(--color-obsidian);
        }

        .pill.muted {
            border-color: var(--color-ash);
            color: var(--color-ash);
        }





        /* — Right content: movie grid — */
        .content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        #movies {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0;
            flex: 1;
        }

        .movie-card {
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .movie-card img {
            width: 100%;
            height: 340px;
            object-fit: cover;
            display: block;
            border-radius: 0;
            transition: opacity 0.2s;
        }

        .movie-card:hover img {
            opacity: 0.75;
        }

        .movie-card .overlay-pill {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 13px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-bone);
            background: rgba(0, 0, 0, 0.5);
            color: var(--color-bone);
            font-size: 13px;
            line-height: 1;
            pointer-events: none;
        }

        .movie-card .card-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 12px 12px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
        }

        .movie-card .card-label h3 {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .movie-card .card-label p {
            font-family: var(--font-victor-serif);
            /* font-style: italic; */
            font-size: 13px;
            color: var(--color-ash);
        }


        /* — Spinner — */
        .spinner {
            width: 20px;
            height: 20px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-bone);
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        .spinner-large {
            width: 40px;
            height: 40px;
        }

        .spinner-center {
            margin: 60px auto;
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* — Modal — */
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 20;
            justify-content: center;
            align-items: center;
        }

        #modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--color-obsidian);
            border: 1px solid var(--color-bone);
            max-width: 860px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            gap: 0;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 20px;
            cursor: pointer;
            font-size: 28px;
            color: var(--color-ash);
            z-index: 1;
            line-height: 1;
        }

        #modalImg {
            width: 280px;
            min-height: 400px;
            object-fit: cover;
            display: block;
            border-radius: 0;
        }

        .modal-details {
            flex: 1;
            padding: 24px;
        }

        .modal-details h2 {
            font-size: 36px;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 13px;
        }

        .modal-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 16px;
        }

        .modal-genres .pill {
            font-size: 12px;
            padding: 5px 10px;
            border-color: var(--color-ash);
            color: var(--color-ash);
        }

        .modal-meta {
            font-family: var(--font-victor-serif);
            font-style: italic;
            color: var(--color-ash);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .modal-desc {
            font-size: 15px;
            line-height: 1.5;
            color: var(--color-ash);
            margin-bottom: 24px;
        }

        #modalLinks {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 13px;
            border-top: 1px solid var(--color-bone);
        }

        .magnet-btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-bone);
            background: transparent;
            color: var(--color-bone);
            font-family: var(--font-lausanne);
            font-size: 14px;
            font-weight: 400;
            text-decoration: none;
            line-height: 1;
        }

        /* — Wishlist View — */
        #wishlistView {
            display: none;
            flex-direction: column;
            padding: 40px;
            gap: 16px;
        }

        .wishlist-item {
            font-size: 8vw;
            font-weight: 400;
            line-height: 0.95;
            letter-spacing: -2px;
            color: var(--color-bone);
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
            word-wrap: break-word;
        }

        .wishlist-item:hover {
            opacity: 0.7;
        }

        .wishlist-item sup {
            font-size: 16px;
            font-family: var(--font-victor-serif);
            vertical-align: super;
            margin-left: 12px;
            color: var(--color-ash);
            letter-spacing: 0;
        }


        /* — Scrollbar — */
        .sidebar::-webkit-scrollbar,
        .content::-webkit-scrollbar {
            width: 0;
        }

        /* — Mobile — */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }

            .layout {
                flex-direction: column;
                height: auto;
            }

            .sidebar {
                width: 100%;
                max-width: 100%;
                min-width: 0;
                border-right: none;
                border-bottom: 1px solid var(--color-bone);
                overflow-y: visible;
            }

            .section-head h2 {
                font-size: 28px;
            }

            .section-head {
                padding: 12px 16px 8px;
            }

            .filter-grid {
                padding: 0 16px 12px;
            }

            .sidebar-section {
                padding: 12px 16px;
            }

            .sidebar-section h3 {
                font-size: 20px;
                margin-bottom: 8px;
            }

            .sidebar-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 16px;
            }

            .nav-pills {
                padding-top: 0;
            }

            .pill {
                font-size: 13px;
                padding: 6px 11px;
            }

            .content {
                overflow: visible;
            }

            #movies {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .movie-card img {
                height: 220px;
            }

            .movie-card .card-label {
                padding: 30px 8px 8px;
            }

            .movie-card .card-label h3 {
                font-size: 13px;
            }

            .movie-card .card-label p {
                font-size: 11px;
            }

            .movie-card .overlay-pill {
                font-size: 11px;
                padding: 4px 10px;
            }

            #modalImg {
                width: 100%;
                min-height: 260px;
            }

            .modal-content {
                flex-direction: column;
                width: 96%;
            }

            .modal-details {
                padding: 16px;
            }

            .modal-details h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="layout">
        <!-- Left sidebar / control column -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <input type="text" class="search-pill" id="searchInput" placeholder="Search title, actor, director...">
                <div class="nav-pills">
                    <button class="pill active" id="navBrowse">Browse</button>
                    <button class="pill" id="navTop">Top Rated</button>
                    <button class="pill" id="navLiked">Liked</button>
                </div>
            </div>

            <div class="section-head">
                <h2>Genre</h2>
                <button class="collapse-btn" id="collapseGenre" aria-label="Toggle genres">−</button>
            </div>
            <div class="filter-grid" id="filters">
                <button class="pill active" data-genre="">Selected</button>
                <button class="pill" data-genre="action">Action</button>
                <button class="pill" data-genre="adventure">Adventure</button>
                <button class="pill" data-genre="animation">Animation</button>
                <button class="pill" data-genre="comedy">Comedy</button>
                <button class="pill" data-genre="crime">Crime</button>
                <button class="pill" data-genre="documentary">Documentary</button>
                <button class="pill" data-genre="drama">Drama</button>
                <button class="pill" data-genre="family">Family</button>
                <button class="pill" data-genre="fantasy">Fantasy</button>
                <button class="pill" data-genre="history">History</button>
                <button class="pill" data-genre="horror">Horror</button>
                <button class="pill" data-genre="music">Music</button>
                <button class="pill" data-genre="mystery">Mystery</button>
                <button class="pill" data-genre="romance">Romance</button>
                <button class="pill" data-genre="sci-fi">Sci-Fi</button>
                <button class="pill" data-genre="thriller">Thriller</button>
                <button class="pill" data-genre="war">War</button>
                <button class="pill" data-genre="western">Western</button>
            </div>

            <div class="section-head">
                <h2>Sort</h2>
                <button class="collapse-btn" id="collapseSort" aria-label="Toggle sort">−</button>
            </div>
            <div class="filter-grid" id="sortPills">
                <button class="pill active" data-sort="date_added">Latest</button>
                <button class="pill" data-sort="rating">Rating</button>
                <button class="pill" data-sort="year">Year</button>
                <button class="pill" data-sort="title">Title</button>
                <button class="pill" data-sort="seeds">Seeds</button>
                <button class="pill" data-sort="download_count">Downloads</button>
            </div>

            <div class="section-head">
                <h2>Quality</h2>
                <button class="collapse-btn" id="collapseQuality" aria-label="Toggle quality">−</button>
            </div>
            <div class="filter-grid" id="qualityPills">
                <button class="pill active" data-quality="">All</button>
                <button class="pill" data-quality="720p">720p</button>
                <button class="pill" data-quality="1080p">1080p</button>
                <button class="pill" data-quality="2160p">4K</button>
                <button class="pill" data-quality="3D">3D</button>
            </div>


        </aside>

        <!-- Right content: movie grid -->
        <main class="content">
            <div id="movies"></div>
            <div id="wishlistView"></div>
            <div id="sentinel" style="padding:20px;text-align:center;color:var(--color-ash);font-size:14px;"></div>
        </main>
    </div>



    <!-- Modal -->
    <div id="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <img id="modalImg" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="">
            <div class="modal-details">
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <h2 id="modalTitle"></h2>
                    <button class="pill" id="likeBtn" style="margin-left: 16px; min-width: 80px;">Like</button>
                </div>
                <div class="modal-genres" id="modalGenres"></div>
                <p class="modal-meta" id="modalMeta"></p>
                <p class="modal-desc" id="modalDesc"></p>
                <div id="modalLinks"></div>
            </div>
        </div>
    </div>

    <script>
        // — API —
        const BASE_URL = 'https://movies-api.accel.li/api/v2';

        const trackers = [
            'udp://tracker.opentrackr.org:1337/announce',
            'udp://tracker.torrent.eu.org:451/announce',
            'udp://tracker.dler.org:6969/announce',
            'udp://open.stealth.si:80/announce',
            'udp://open.demonii.com:1337/announce',
            'udp://tracker.srv00.com:6969/announce'
        ].map(t => `tr=${encodeURIComponent(t)}`).join('&');

        async function listMovies(page = 1, query = '', genre = '', sort = 'date_added', quality = '') {
            const url = new URL(`${BASE_URL}/list_movies.json`);
            url.searchParams.append('page', page);
            if (query) url.searchParams.append('query_term', query);
            if (genre) url.searchParams.append('genre', genre);
            if (sort) url.searchParams.append('sort_by', sort);
            if (quality) url.searchParams.append('quality', quality);

            const res = await fetch(url);
            const json = await res.json();
            return json.data;
        }

        async function getMovieDetails(id) {
            const url = new URL(`${BASE_URL}/movie_details.json`);
            url.searchParams.append('movie_id', id);

            const res = await fetch(url);
            const json = await res.json();
            return json.data.movie;
        }

        function getMagnetUrl(hash, title) {
            return `magnet:?xt=urn:btih:${hash}&dn=${encodeURIComponent(title)}&${trackers}`;
        }

        // — App —
        let currentPage = 1;
        let currentQuery = '';
        let currentGenre = '';
        let currentSort = 'year';
        let currentQuality = '';
        let loading = false;
        let hasMore = true;

        const moviesEl = document.getElementById('movies');
        const searchInput = document.getElementById('searchInput');
        const sentinel = document.getElementById('sentinel');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalMeta = document.getElementById('modalMeta');
        const modalDesc = document.getElementById('modalDesc');
        const modalLinks = document.getElementById('modalLinks');
        const modalGenres = document.getElementById('modalGenres');
        const likeBtn = document.getElementById('likeBtn');
        const wishlistView = document.getElementById('wishlistView');

        let likedMovies = JSON.parse(localStorage.getItem('likedMovies') || '[]');
        let currentModalMovie = null;


        async function loadMovies(reset = false) {
            if (loading) return;
            if (!reset && !hasMore) return;
            loading = true;
            if (reset) {
                moviesEl.innerHTML = '<div class="spinner spinner-large spinner-center"></div>';
                currentPage = 1;
                hasMore = true;
            }
            sentinel.innerHTML = '<div class="spinner"></div>';
            try {
                const data = await listMovies(currentPage, currentQuery, currentGenre, currentSort, currentQuality);
                if (reset) moviesEl.innerHTML = ''; // clear the spinner
                if (data.movies) renderMovies(data.movies);

                hasMore = data.movie_count > currentPage * data.limit;
                sentinel.textContent = hasMore ? '' : 'No more movies';
            } catch (e) {
                console.error('Failed to load movies', e);
                sentinel.textContent = 'Error loading movies';
            }
            loading = false;
        }

        function renderMovies(movies) {
            const html = movies.map(m => `
            <div class="movie-card" onclick="openDetails(${m.id}, '${m.medium_cover_image}')">
                <img src="${m.medium_cover_image}" alt="${m.title}" loading="lazy">
                <span class="overlay-pill">${m.year}</span>
                <div class="card-label">
                    <h3>${m.title}</h3>
                    <p>${m.rating}/10</p>
                </div>
            </div>
        `).join('');
            moviesEl.insertAdjacentHTML('beforeend', html);
        }

        async function openDetails(id, coverUrl) {
            modalTitle.innerHTML = '<div class="spinner"></div>';
            modalImg.src = coverUrl || 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
            modalMeta.textContent = '';
            modalDesc.textContent = '';
            modalLinks.innerHTML = '';
            modalGenres.innerHTML = '';
            modal.classList.add('active');

            // Check if liked early using just the ID
            const isLiked = likedMovies.some(m => m.id === id);
            likeBtn.textContent = isLiked ? 'Liked' : 'Like';
            if (isLiked) likeBtn.classList.add('active'); else likeBtn.classList.remove('active');

            try {
                const m = await getMovieDetails(id);
                currentModalMovie = m;
                modalTitle.textContent = m.title_long;
                modalMeta.textContent = `${m.rating}/10 · ${m.runtime} min · ${m.language.toUpperCase()} · ${m.mpa_rating || '—'}`;
                modalDesc.textContent = m.description_full || m.description_intro || '';
                modalGenres.innerHTML = m.genres ? m.genres.map(g => `<span class="pill">${g}</span>`).join('') : '';
                modalLinks.innerHTML = m.torrents ? m.torrents.map(t =>
                    `<a href="${getMagnetUrl(t.hash, m.title)}" class="pill" style="color:var(--color-bone); border-color:var(--color-bone);">${t.quality} · ${t.type} · ${t.size}</a>`
                ).join('') : 'No torrents available';
            } catch (e) {
                modalTitle.textContent = 'Error loading details';
            }
        }

        document.getElementById('closeModal').onclick = () => modal.classList.remove('active');
        modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchInput._t);
            searchInput._t = setTimeout(() => {
                currentQuery = e.target.value;
                loadMovies(true);
            }, 500);
        });

        function setupPillGroup(containerId, callback) {
            document.getElementById(containerId).addEventListener('click', (e) => {
                const pill = e.target.closest('.pill');
                if (!pill) return;
                pill.parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                callback(pill);
            });
        }

        setupPillGroup('filters', (pill) => { currentGenre = pill.dataset.genre; loadMovies(true); });
        setupPillGroup('sortPills', (pill) => { currentSort = pill.dataset.sort; loadMovies(true); });
        setupPillGroup('qualityPills', (pill) => { currentQuality = pill.dataset.quality; loadMovies(true); });

        function setupCollapse(btnId, gridId) {
            document.getElementById(btnId).addEventListener('click', function () {
                const grid = document.getElementById(gridId);
                grid.classList.toggle('collapsed');
                this.textContent = grid.classList.contains('collapsed') ? '+' : '−';
            });
        }

        setupCollapse('collapseGenre', 'filters');
        setupCollapse('collapseSort', 'sortPills');
        setupCollapse('collapseQuality', 'qualityPills');

        document.getElementById('navBrowse').onclick = (e) => {
            e.preventDefault();
            document.querySelectorAll('.nav-pills .pill').forEach(p => p.classList.remove('active'));
            e.target.classList.add('active');
            moviesEl.style.display = 'grid';
            sentinel.style.display = 'block';
            wishlistView.style.display = 'none';
            currentSort = 'date_added';
            loadMovies(true);
        };

        document.getElementById('navTop').onclick = (e) => {
            e.preventDefault();
            document.querySelectorAll('.nav-pills .pill').forEach(p => p.classList.remove('active'));
            e.target.classList.add('active');
            moviesEl.style.display = 'grid';
            sentinel.style.display = 'block';
            wishlistView.style.display = 'none';
            currentSort = 'rating';
            document.querySelectorAll('#sortPills .pill').forEach(p => p.classList.remove('active'));
            document.querySelector('#sortPills .pill[data-sort="rating"]').classList.add('active');
            loadMovies(true);
        };

        document.getElementById('navLiked').onclick = (e) => {
            e.preventDefault();
            document.querySelectorAll('.nav-pills .pill').forEach(p => p.classList.remove('active'));
            e.target.classList.add('active');
            moviesEl.style.display = 'none';
            sentinel.style.display = 'none';
            wishlistView.style.display = 'flex';
            renderWishlist();
        };

        function renderWishlist() {
            if (likedMovies.length === 0) {
                wishlistView.innerHTML = '<p style="color:var(--color-ash); font-size:24px;">No liked movies yet.</p>';
                return;
            }
            wishlistView.innerHTML = likedMovies.map(m =>
                `<a class="wishlist-item" onclick="openDetails(${m.id}, '${m.coverUrl}')">${m.title}<sup>${m.year}</sup></a>`
            ).join('');
        }

        likeBtn.onclick = () => {
            if (!currentModalMovie) return;
            const index = likedMovies.findIndex(m => m.id === currentModalMovie.id);
            if (index > -1) {
                likedMovies.splice(index, 1);
                likeBtn.textContent = 'Like';
                likeBtn.classList.remove('active');
            } else {
                likedMovies.push({
                    id: currentModalMovie.id,
                    title: currentModalMovie.title_long || currentModalMovie.title,
                    year: currentModalMovie.year,
                    coverUrl: currentModalMovie.medium_cover_image
                });
                likeBtn.textContent = 'Liked';
                likeBtn.classList.add('active');
            }
            localStorage.setItem('likedMovies', JSON.stringify(likedMovies));
            if (wishlistView.style.display === 'flex') renderWishlist();
        };

        // Infinite scroll
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !loading && hasMore) {
                currentPage++;
                loadMovies();
            }
        }, { rootMargin: '400px' });
        observer.observe(sentinel);

        loadMovies();
    </script>
</body>

</html>
